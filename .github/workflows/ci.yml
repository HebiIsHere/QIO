name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI never needs real API keys: all model tests use fake/mock providers and
# offline fixtures. External-network tests are not merge blockers.
env:
  PYTHONHASHSEED: "0"

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only: no dependencies to install
      - name: Check docs against code
        run: python scripts/check_docs.py

  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock   # cache key bound to lockfile
      - name: Sync dependencies from lock
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run --frozen pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json  # bound to lockfile
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri   # keyed on Cargo.lock
      # Tauri 在 Linux 上依赖一组系统库（webkit2gtk / libsoup / librsvg 等）。
      # 裸 ubuntu runner 什么都没装，缺了它们 cargo check 必然失败 ——
      # 这正是 rust 任务此前一直红的原因，而不是 Rust 代码本身有问题。
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      - name: cargo check
        run: cargo check
