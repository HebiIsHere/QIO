name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI never needs real API keys: all model tests use fake/mock providers and
# offline fixtures. External-network tests are not merge blockers.
env:
  PYTHONHASHSEED: "0"

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock   # cache key bound to lockfile
      - name: Sync dependencies from lock
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run --frozen pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json  # bound to lockfile
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri   # keyed on Cargo.lock
      - name: cargo check
        run: cargo check
