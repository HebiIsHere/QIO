name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI never needs real API keys: all model tests use fake/mock providers and
# offline fixtures. External-network tests are not merge blockers.
env:
  PYTHONHASHSEED: "0"

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only: no dependencies to install
      - name: Check docs against code
        run: python scripts/check_docs.py

  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock   # cache key bound to lockfile
      - name: Sync dependencies from lock
        run: uv sync --frozen --extra dev
      - name: Run tests
        env:
          # 让 pytest 额外落一份 JUnit 报告，供下一步在失败时生成注解。
          # 命令本身保持单行不变（scripts/check_docs.py 会校验它与 SETUP.md 一致）。
          PYTEST_ADDOPTS: "--junitxml=pytest-results.xml"
        run: uv run --frozen pytest -q
      # Actions 的原始日志必须登录才能下载；**注解是公开可读的**。
      # 失败时把「哪些用例挂了、报什么错」变成注解，CI 红了才有人能立刻定位。
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("pytest-results.xml") or glob.glob("**/pytest-results.xml", recursive=True)
          if not paths:
              print("::error title=pytest::no junit report written (collection/import error before tests ran)")
              raise SystemExit(0)

          bad = []
          for case in ET.parse(paths[0]).getroot().iter("testcase"):
              problems = list(case.findall("failure")) + list(case.findall("error"))
              if not problems:
                  continue
              message = (problems[0].get("message") or "").strip()
              text = (problems[0].text or "").strip()
              bad.append((f"{case.get('classname')}::{case.get('name')}", f"{message}\n{text}"[:1800]))

          print(f"::error title=pytest failures ({len(bad)})::" + " | ".join(name for name, _ in bad[:12]))
          # 一条用例一条注解：注解是公开可读的，失败细节不至于被折叠掉
          for name, detail in bad[:20]:
              flat = " / ".join(line.strip() for line in detail.splitlines() if line.strip())
              print(f"::error title={name}::{flat[:1400]}")
          PY

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json  # bound to lockfile
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri   # keyed on Cargo.lock
      # Tauri 在 Linux 上依赖一组系统库（webkit2gtk / libsoup / librsvg 等）。
      # 裸 ubuntu runner 什么都没装，缺了它们 cargo check 必然失败 ——
      # 这正是 rust 任务此前一直红的原因，而不是 Rust 代码本身有问题。
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      # Tauri 的 externalBin（后端 sidecar）仓库里只有 Windows 版（体积大、被 gitignore）。
      # build script 会检查对应 target triple 的文件是否存在，Linux 上必然缺失 ——
      # 这里放一个占位文件让 cargo check 能完成编译检查（这一步不产出发布包）。
      - name: Provide sidecar placeholder for cargo check
        if: runner.os == 'Linux'
        run: |
          mkdir -p binaries
          touch binaries/qio-backend-x86_64-unknown-linux-gnu
          chmod +x binaries/qio-backend-x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo check
      # 同上：失败时把 cargo 的报错摘要变成公开可读的注解。
      - name: Summarize cargo errors
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          cargo check --message-format=short 2>&1 | tee cargo.log || true
          python - <<'PY'
          import re

          lines = [
              line.rstrip()
              for line in open("cargo.log", encoding="utf-8", errors="replace")
          ]
          errors = [ln for ln in lines if re.search(r"\berror\b", ln, re.I)]
          print(f"::error title=cargo check failed ({len(errors)} error lines)::" + " | ".join(e[:180] for e in errors[:6]))
          print("::error title=cargo tail::" + " / ".join(ln.strip() for ln in lines[-40:] if ln.strip())[:1400])
          PY
