name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI never needs real API keys: all model tests use fake/mock providers and
# offline fixtures. External-network tests are not merge blockers.
env:
  PYTHONHASHSEED: "0"

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # stdlib only: no dependencies to install
      - name: Check docs against code
        run: python scripts/check_docs.py
      # 离线发布闸门自己也要有人验证：--selftest 只检查闸门能正确变红/变绿
      #（不构建安装包、不联网、不依赖 sidecar 或 ONNX 模型）。闸门坏了没人知道，
      # 那它就是纸面能力 —— 所以这一步必须真跑。前提：scripts/release_gate.py 已入库。
      - name: Release gate selftest
        run: |
          python scripts/release_gate.py --selftest

  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock   # cache key bound to lockfile
      - name: Sync dependencies from lock
        run: uv sync --frozen --extra dev
      # 真 worker 冒烟（源码路径）：与 Windows 的冻结冒烟是**同一套**三项检查，
      # 只是换一个子进程命令前缀 —— 「打包之后成立」与「源码里成立」都要真执行证据。
      # 用多行 run: | 形式：scripts/check_docs.py 只把单行 run: 命令与 SETUP.md 对齐，
      # 这条是新增的冒烟入口，不属于「安装/测试命令」那类。
      - name: Real worker smoke (source)
        run: |
          uv run --frozen python ../scripts/frozen_worker_smoke.py --script src/agent/tool_worker.py
      # 显式把 worker 协议的两组用例单独跑一遍：ubuntu runner 上 docker 守护进程真的
      # 可用（这正是它们此前全红的根因），注入的 fake worker 必须仍然被使用；
      # 协议严格化（ok 必须是 bool / 恰好一行 / 空输出 / 非零退出 / 取消语义）都在这里。
      - name: Fake worker protocol tests (Linux)
        env:
          # 这一步也要落 JUnit：否则它失败时「Summarize test failures」只找得到
          # pytest-results.xml（不存在），注解只剩一句 "no junit report written"，
          # 定位成本极高（2026-10-02 实测到过一次偶发红，就是因为这个才难查）。
          PYTEST_ADDOPTS: "--junitxml=pytest-results.xml"
        run: |
          uv run --frozen pytest -q tests/test_sandbox_worker.py tests/test_tool_worker.py
      - name: Run tests
        env:
          # 让 pytest 额外落一份 JUnit 报告，供下一步在失败时生成注解。
          # 命令本身保持单行不变（scripts/check_docs.py 会校验它与 SETUP.md 一致）。
          PYTEST_ADDOPTS: "--junitxml=pytest-results.xml"
        run: uv run --frozen pytest -q
      # Actions 的原始日志必须登录才能下载；**注解是公开可读的**。
      # 失败时把「哪些用例挂了、报什么错」变成注解，CI 红了才有人能立刻定位。
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("pytest-results.xml") or glob.glob("**/pytest-results.xml", recursive=True)
          if not paths:
              print("::error title=pytest::no junit report written (collection/import error before tests ran)")
              raise SystemExit(0)

          bad = []
          for case in ET.parse(paths[0]).getroot().iter("testcase"):
              problems = list(case.findall("failure")) + list(case.findall("error"))
              if not problems:
                  continue
              message = (problems[0].get("message") or "").strip()
              text = (problems[0].text or "").strip()
              bad.append((f"{case.get('classname')}::{case.get('name')}", f"{message}\n{text}"[:1800]))

          print(f"::error title=pytest failures ({len(bad)})::" + " | ".join(name for name, _ in bad[:12]))
          # 一条用例一条注解：注解是公开可读的，失败细节不至于被折叠掉
          for name, detail in bad[:20]:
              flat = " / ".join(line.strip() for line in detail.splitlines() if line.strip())
              print(f"::error title={name}::{flat[:1400]}")
          PY

  # Windows 是发布平台，也是启动加固（系统命令硬超时）与凭据库（keyring）唯一
  # 真机验证过的环境，而它们恰恰是 Linux 任务看不见的路径。这里跑同一套后端
  # 测试，失败摘要与 Linux 任务用同一套注解（注解公开可读，原始日志要登录）。
  backend-windows:
    name: backend (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies from lock
        run: uv sync --frozen --extra dev
      # GitHub 的 windows runner 装了 docker CLI，但没有可用的守护进程。沙箱会先探测
      # 守护进程、探测不到就改走受限子进程（tools/sandbox.py），所以这条路径不再以
      # `docker exit code 125` 收场；requires_docker 标记留下，把「要真实容器隔离」的
      # 用例挑出来，ubuntu 任务照常跑它们。
      - name: Run tests
        env:
          PYTEST_ADDOPTS: "--junitxml=pytest-results.xml"
        run: uv run --frozen pytest -q -m "not requires_docker"
      - name: Summarize test failures
        if: failure()
        shell: bash
        env:
          # Windows 控制台默认 cp1252，中文失败原因会撞 UnicodeEncodeError，
          # 结果是「注解一条都没发出来」—— 这一步的意义就没了。
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("pytest-results.xml") or glob.glob("**/pytest-results.xml", recursive=True)
          if not paths:
              print("::error title=pytest (windows)::no junit report written (collection/import error before tests ran)")
              raise SystemExit(0)

          bad = []
          for case in ET.parse(paths[0]).getroot().iter("testcase"):
              problems = list(case.findall("failure")) + list(case.findall("error"))
              if not problems:
                  continue
              message = (problems[0].get("message") or "").strip()
              text = (problems[0].text or "").strip()
              bad.append((f"{case.get('classname')}::{case.get('name')}", f"{message}\n{text}"[:1800]))

          print(f"::error title=pytest failures on windows ({len(bad)})::" + " | ".join(name for name, _ in bad[:12]))
          for name, detail in bad[:20]:
              flat = " / ".join(line.strip() for line in detail.splitlines() if line.strip())
              print(f"::error title={name}::{flat[:1400]}")
          PY

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json  # bound to lockfile
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri   # keyed on Cargo.lock
      # Tauri 在 Linux 上依赖一组系统库（webkit2gtk / libsoup / librsvg 等）。
      # 裸 ubuntu runner 什么都没装，缺了它们 cargo check 必然失败 ——
      # 这正是 rust 任务此前一直红的原因，而不是 Rust 代码本身有问题。
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      # Tauri 的 externalBin（后端 sidecar）仓库里只有 Windows 版（体积大、被 gitignore）。
      # build script 会检查对应 target triple 的文件是否存在，Linux 上必然缺失 ——
      # 这里放一个占位文件让 cargo check 能完成编译检查（这一步不产出发布包）。
      - name: Provide sidecar placeholder for cargo check
        if: runner.os == 'Linux'
        run: |
          mkdir -p binaries
          touch binaries/qio-backend-x86_64-unknown-linux-gnu
          chmod +x binaries/qio-backend-x86_64-unknown-linux-gnu
      # 同理，`bundle.resources` 指向内置模型目录（90MB 二进制，也被 gitignore）。
      # Tauri 的 build script 对「不含通配符的资源路径」只检查路径是否存在，路径缺失就报
      # `resource path `resources/models` doesn't exist` 并以 exit 1 结束 —— cargo check 直接红。
      # 放一个空占位目录即可：空目录不产出任何资源，也不会报错（这一步不产出发布包）。
      - name: Provide bundled-model placeholder for cargo check
        run: |
          mkdir -p resources/models/bge-small-zh-v1.5
      - name: cargo check
        run: cargo check
      # 同上：失败时把 cargo 的报错摘要变成公开可读的注解。
      - name: Summarize cargo errors
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          cargo check --message-format=short 2>&1 | tee cargo.log || true
          python - <<'PY'
          import re

          lines = [
              line.rstrip()
              for line in open("cargo.log", encoding="utf-8", errors="replace")
          ]
          errors = [ln for ln in lines if re.search(r"\berror\b", ln, re.I)]
          print(f"::error title=cargo check failed ({len(errors)} error lines)::" + " | ".join(e[:180] for e in errors[:6]))
          print("::error title=cargo tail::" + " / ".join(ln.strip() for ln in lines[-40:] if ln.strip())[:1400])
          PY

  # 壳的单元测试以前哪都不跑：ubuntu 任务只做 cargo check。于是
  # `#[cfg(windows)]` 的启动加固用例（系统命令硬超时、杀子进程）一次都没被执行过 ——
  # 而那正是 2026-09-25 白屏事故的修复点。Windows 上补一遍真跑。
  rust-windows:
    name: rust (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      # 与 ubuntu 任务同理：externalBin 只有被 gitignore 的本机文件，build script
      # 检查不到就直接编译失败。放空占位，让单测能编译起来（这一步不产出安装包）。
      - name: Provide sidecar placeholder (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path binaries/qio-backend-x86_64-pc-windows-msvc.exe | Out-Null
      # bundle.resources 指向内置模型目录，缺路径 build script 同样报错。
      - name: Provide bundled-model placeholder
        run: |
          New-Item -ItemType Directory -Force -Path resources/models/bge-small-zh-v1.5 | Out-Null
      - name: Unit tests
        run: cargo test

  # 冻结产物验证：源码测试跑的是 python，用户机器上跑的是打包后的 exe。
  # 这里真的把 sidecar 打出来，再对着它跑工具 worker 的三项冒烟（单文件 /
  # 多文件项目 / 坏 worker 被拒）。跑得慢，但这是唯一能证明「打包之后仍然成立」的地方。
  frozen-worker:
    name: frozen worker (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync backend dependencies from lock
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Build the frozen sidecar
        run: pwsh -File scripts/build_sidecar.ps1
      # 容器隔离执行要把 worker 源码带进容器（tools/executor_env.py::worker_source()）。
      # 冻结产物里没有 .py 文件，靠 build_sidecar.ps1 的 --add-data 放进包里；这里直接
      # 读 onefile 归档，确认那份资源真的在**产物里**（而不是只在源码树上）。
      # 本机沙箱不允许 onefile 解包，所以这条断言只能在 CI 上真跑。
      - name: Verify the bundled worker source
        working-directory: backend
        run: |
          uv run --frozen --with pyinstaller pyi-archive_viewer -l ../frontend/src-tauri/binaries/qio-backend-x86_64-pc-windows-msvc.exe | Out-File -Encoding utf8 archive.txt
          if (-not (Select-String -Path archive.txt -Pattern 'tool_worker\.py' -Quiet)) {
            Write-Error '冻结产物里没有 agent/tool_worker.py：容器执行路径会拿不到 worker 源码'
            exit 1
          }
      - name: Smoke-test the frozen worker protocol
        run: python scripts/frozen_worker_smoke.py frontend/src-tauri/binaries/qio-backend-x86_64-pc-windows-msvc.exe
      # 冻结产物的进程模型与 Job Object 时序（scripts/verify_backend_process_model.py，Agent A 实测脚本）。
      # 它只**采集数据**（跑完 return 0），所以这里串上 check_backend_process_model.py 当闸门：
      # 「launcher+child 同 exe」「只杀 launcher 会留孤儿占端口」「立即 assign 收住 child、不留孤儿」
      # 「延迟 assign 会逃逸」任何一条变了 → 这一步红（需要人工重新验证，而不是悄悄变绿）。
      # PYTHONIOENCODING：Windows runner 的控制台默认 cp1252，脚本里的中文输出会撞
      # UnicodeEncodeError（第一次上线就是这样红的）——与既有失败摘要步骤同一条约定。
      - name: Backend process model (onefile launcher/child)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/verify_backend_process_model.py --exe frontend/src-tauri/binaries/qio-backend-x86_64-pc-windows-msvc.exe --case 2 --json "$env:RUNNER_TEMP\process-model-case2.json" --work "$env:RUNNER_TEMP\process-model-case2"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=process model verify (case 2)::verify_backend_process_model.py 退出码 $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          python scripts/check_backend_process_model.py --report "$env:RUNNER_TEMP\process-model-case2.json" --case 2
      - name: Backend process model (Job Object timing)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/verify_backend_process_model.py --exe frontend/src-tauri/binaries/qio-backend-x86_64-pc-windows-msvc.exe --case job --json "$env:RUNNER_TEMP\process-model-job.json" --work "$env:RUNNER_TEMP\process-model-job"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=process model verify (case job)::verify_backend_process_model.py 退出码 $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          python scripts/check_backend_process_model.py --report "$env:RUNNER_TEMP\process-model-job.json" --case job
