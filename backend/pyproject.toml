[project]
name = "qio"
version = "0.3.2"
description = "Agent with agentloop, dual memory-knowledge domains, self-created tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic>=2.7",
    "keyring>=25",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    # 卡片内预览：PDF 的只读事实（页数/标题/加密/可提取文本量）。纯 Python，PyInstaller 友好。
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "real_verify: 直接覆盖真实的凭据验证逻辑（网络仍由 fake 客户端替代）",
    "requires_docker: 需要真实可用的 docker 守护进程（GitHub 的 windows runner 只有 CLI，没有 daemon）",
    "real_migrations: 必须逐次对独立空库重放真实迁移（迁移/升级/旧版本/结构自愈/DB 初始化/持久性），不依赖模板库克隆",
    "serial: 依赖真实进程清理/共享系统资源/严格时序/固定端口，由入口脚本放到串行阶段（-p no:xdist）执行",
    "topic_application: 本文件直接验证话题申请/确认/拒绝的真实审批交互，禁用 conftest 的旧测试自动批准兜底",
]
