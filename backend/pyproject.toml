[project]
name = "qio"
version = "0.1.13"
description = "Agent with agentloop, dual memory-knowledge domains, self-created tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic>=2.7",
    "keyring>=25",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "real_verify: 直接覆盖真实的凭据验证逻辑（网络仍由 fake 客户端替代）",
    "requires_docker: 需要真实可用的 docker 守护进程（GitHub 的 windows runner 只有 CLI，没有 daemon）",
]
