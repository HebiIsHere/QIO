<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内联图标：避免开发服务器每次加载都产生 favicon 404（与 index.html 一致） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c51b7d' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='6' fill='none' stroke='%23e878bd' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>QIO 原子控件画廊</title>
  </head>
  <body>
    <!--
      多页入口：只用于 UI 穷举截图（scripts/ui-catalog/atoms.mjs）。
      刻意放在 frontend/ 根目录、src/ 之外：不进 vue-tsc 的类型检查范围，
      也不是 `vite build` 的入口（默认入口仍是 index.html），产品构建产物不含这一页。
    -->
    <div id="gallery"></div>
    <script type="module" src="/ui-catalog/main.ts"></script>
  </body>
</html>
