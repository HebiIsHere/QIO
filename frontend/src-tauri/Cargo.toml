[package]
name = "qio"
version = "0.1.3"
description = "QIO desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 应用内更新：updater 负责「检查 / 下载 / 签名校验 / 安装」，process 负责装完重启。
# 网络请求在 Rust 侧发出，所以不需要放宽前端 CSP。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
