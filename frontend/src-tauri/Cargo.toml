[package]
name = "qio"
version = "0.1.8"
description = "QIO desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# 应用内更新：updater 负责「检查 / 下载 / 签名校验 / 安装」，process 负责装完重启。
# 网络请求在 Rust 侧发出，所以不需要放宽前端 CSP。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 文件日志：updater 插件把真实失败原因写进 log crate（而它抛给前端的是一句固定文案），
# 没有日志就只能靠猜 —— 2026-09-22 实测踩过。
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 只用 Windows Job Object：把后端进程放进「随 job 关闭而终止」的 job 里，
# 壳一死（正常退出、被强杀、被安装器结束）整个后端进程树都会被系统清掉，
# 不会再有孤儿进程锁住 qio-backend.exe 导致安装中止。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
